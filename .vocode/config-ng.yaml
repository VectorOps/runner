# Default Vocode configuration
logging:
  #default_level: debug
debugging:
#  capture_llm_payload: true
variables:
  LLM_ARCHITECT_REASONING: high
# OpenAI
  LLM_DISCOVERY_MODEL:
    value: chatgpt/gpt-6-luna:fast
    type: llm_models
  LLM_ARCHITECT_MODEL:
    value: chatgpt/gpt-6.1-sol
    type: llm_models
  LLM_CODER_MODEL:
    value: chatgpt/gpt-6-luna:fast
    type: llm_models
  LLM_DIFF_FORMAT: v4a
internal_http:
  port: 5050
default_workflow: "agent"
tools:
  - name: read_files
    auto_approve: true
  - name: summarize_files
    auto_approve: true
  - name: list_files
    auto_approve: true
  - name: search_project
    auto_approve: true
  - name: run_agent
    auto_approve: true
